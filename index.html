<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알고리즘 스택버거 마스터</title>
    <!-- Google Fonts: 가독성이 뛰어난 주아(Jua)와 컴포타(Comfortaa) 폰트 연결 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Jua', 'Comfortaa', sans-serif;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background-color: #e0f2fe; /* 산뜻하고 눈이 편안한 하늘색 배경 */
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 1280x720 해상도에 완벽하게 대응하는 메인 규격 슬라이드 */
        .slide-container {
            width: 1280px;
            height: 720px;
            background-color: #fffbeb; /* 따뜻한 느낌의 연한 크림색 배경 */
            border: 8px solid #f59e0b;  /* 노란색 테두리 */
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 35px; /* 내부 여백을 컴팩트하게 압축 */
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
            z-index: 10;
        }

        .stat-box {
            background: #ffffff;
            padding: 10px 25px;
            border-radius: 50px;
            border: 5px solid #d97706; /* 짙은 오렌지 브라운 테두리 */
            font-size: 26px; /* 초등학생 맞춤 큼직한 수치 */
            color: #451a03; 
            font-weight: bold;
            box-shadow: 0 5px 0 #b45309;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 55px;
        }

        .game-main {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 30px;
            height: 380px; /* 세로 공간을 엄격하게 제한하여 아래 트레이가 밀리지 않음 */
            margin-top: 5px;
            margin-bottom: 5px;
        }

        /* 왼쪽: 플레이어 햄버거 접시 영역 (크기 초과 방지 보완) */
        .plate-container {
            background: #ffffff; 
            border-radius: 24px;
            border: 6px dashed #475569; 
            display: flex;
            flex-direction: column-reverse; /* 아래에서부터 빵이 쌓이도록 강제 */
            align-items: center;
            padding: 20px;
            padding-top: 50px; /* 라벨을 피하기 위한 상단 패딩 */
            position: relative;
            justify-content: flex-start;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.05);
            height: 100%;
            overflow: hidden; /* 영역 밖으로 재료가 삐져나가는 일 방지 */
        }

        .plate-label {
            position: absolute;
            top: 12px;
            background: #475569;
            color: white;
            padding: 4px 18px;
            border-radius: 20px;
            font-size: 18px;
            z-index: 10;
        }

        .plate-base {
            width: 320px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 50%;
            margin-top: -3px;
            border: 3px solid #94a3b8;
            z-index: 1;
            flex-shrink: 0;
        }

        .mission-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 100%;
        }

        .mission-card {
            background: #fef2f2;
            border-radius: 20px;
            padding: 15px;
            border: 5px solid #ef4444; 
            text-align: center;
            box-shadow: 0 6px 0 #b91c1c;
            height: 200px; /* 미션 카드 높이 강제 조절 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .mission-card h2 {
            margin: 0;
            font-size: 26px;
            color: #7f1d1d;
            text-shadow: 1px 1px 0px #fca5a5;
        }

        .mission-burger-preview {
            display: flex;
            flex-direction: column-reverse; /* 아래에서부터 가이드 출력 */
            align-items: center;
            background: #ffffff;
            border: 3px solid #fee2e2;
            padding: 8px;
            border-radius: 16px;
            height: 110px; /* 작은 크기로 정밀 가이드 */
            justify-content: center;
            overflow: hidden;
        }

        /* 제출 및 비우기 동작 패널 */
        .control-panel {
            background: #fff8e1;
            border-radius: 20px;
            border: 5px solid #d97706;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #b45309;
            height: 165px; /* 컨트롤 판넬 높이 명확화 */
        }

        .ingredients-tray {
            width: 100%;
            height: 145px; /* 세로 규격 고정 */
            background: #78350f; /* 중후하고 시인성 좋은 초콜릿 브라운 */
            padding: 12px 20px;
            border-radius: 24px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 6px solid #451a03;
            z-index: 10;
        }

        .ingredient-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        .ingredient-btn {
            width: 100%;
            height: 75px; /* 버튼 세로 크기를 콤팩트하게 교정 */
            background: #ffffff;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 5px 0 #cbd5e1;
            border: 3px solid #94a3b8;
            padding: 5px;
        }

        .ingredient-btn:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 8px 0 #cbd5e1;
        }
        
        .ingredient-btn:active { 
            transform: translateY(3px); 
            box-shadow: none; 
        }

        .ingredient-btn svg {
            width: 90%;
            height: 90%;
        }

        .ingredient-label {
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
        }

        /* 쌓이는 버거 재료의 기본 겹침 설계 */
        .burger-layer {
            width: 200px; /* 기존보다 가로를 살짝 줄여 접시에 완벽하게 안착 */
            height: auto;
            margin-bottom: -24px; /* 정교하고 자연스럽게 겹치는 마이너스 마진 */
            animation: fallIn 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 5;
            flex-shrink: 0;
        }

        @keyframes fallIn {
            0% { transform: translateY(-150px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .main-btn {
            background: #10b981; 
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 0 #047857;
            font-family: 'Jua';
            transition: all 0.15s;
            text-shadow: 2px 2px 0px #047857;
        }

        .main-btn:hover {
            background: #34d399;
        }

        .main-btn:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }
        
        .restart-btn {
            background: #ef4444; 
            font-size: 20px;
            padding: 6px 20px;
            box-shadow: 0 4px 0 #b91c1c;
            text-shadow: 1px 1px 0px #7f1d1d;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .restart-btn:hover { background: #f87171; }

        /* 대기 및 로딩 오버레이 */
        #start-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.9); 
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            color: white;
            text-align: center;
            padding: 40px;
        }

        #start-overlay h1 {
            font-size: 80px;
            color: #fbcfe8;
            margin-bottom: 15px;
            text-shadow: 4px 4px 0px #be185d;
        }

        /* 결과 분석 팝업 모달 */
        #result-modal {
            position: absolute;
            inset: 0;
            background: #fffdf5;
            border: 10px solid #f59e0b;
            z-index: 101;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 24px;
            text-align: center;
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popUp {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .score-text { 
            font-size: 90px; 
            color: #f59e0b; 
            margin: 10px 0;
            text-shadow: 4px 4px 0px #78350f;
        }

        /* 커스텀 경고/정보 레이블 팝업 */
        #custom-alert-overlay {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fffbeb;
            border: 6px solid #f59e0b;
            padding: 25px 35px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            z-index: 150;
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 480px;
            width: 90%;
        }
        #custom-alert-text {
            font-size: 24px;
            color: #78350f;
            margin-bottom: 18px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="slide-container">
    <div id="start-overlay">
        <h1>알고리즘 스택버거</h1>
        <p style="font-size: 28px; margin-bottom: 40px; color: #fef08a;">순서대로 재료를 쌓는 최고의 주방장이 되어볼까요?</p>
        <button class="main-btn" style="font-size: 32px; padding: 15px 45px;" onclick="startGame()">게임 시작하기 <i class="fa-solid fa-play"></i></button>
    </div>

    <!-- 브라우저 alert 대체용 커스텀 경고 모달 -->
    <div id="custom-alert-overlay">
        <p id="custom-alert-text">알림 내용</p>
        <button class="main-btn" style="font-size: 20px; padding: 8px 30px;" onclick="closeCustomAlert()">확인 !</button>
    </div>

    <!-- 최종 축하 스코어 카드 모달 -->
    <div id="result-modal">
        <h1 style="font-size: 60px; color: #1e293b; margin: 0;">참 잘했어요! 🍔</h1>
        <p style="font-size: 28px; color: #475569; margin: 5px 0;">완벽하게 순서를 지켜 알고리즘 버거를 만들었어요!</p>
        <div class="score-text" id="final-score">0000</div>
        <p id="final-time-info" style="font-size: 26px; color: #475569; font-weight: bold;"></p>
        <button class="main-btn" onclick="resetGame()" style="margin-top: 20px; font-size: 28px;">다시 시작하기 <i class="fa-solid fa-rotate-right"></i></button>
    </div>

    <div class="header-bar">
        <div class="stat-box" id="timer">⏱️ 시간: 05:00</div>
        <div class="stat-box" id="mission-count">🎯 미션: 1 / 10</div>
        <div class="stat-box" id="score">⭐ 점수: 0</div>
        <button id="restart-control" class="main-btn restart-btn" onclick="resetGame()" style="display: none;"><i class="fa-solid fa-arrow-rotate-left"></i> 다시 하기</button>
    </div>

    <div class="game-main">
        <!-- 버거 플레이트 구역 -->
        <div class="plate-container" id="player-plate">
            <div class="plate-label">나의 접시 (아래쪽 빵부터 쌓으세요)</div>
            <div class="plate-base"></div>
            <!-- 사용자가 투하하는 재료들이 동적으로 삽입되는 영역 -->
        </div>

        <!-- 미션 지시 카드 구역 -->
        <div class="mission-panel">
            <div class="mission-card">
                <h2 id="mission-name">미션: 기본 버거</h2>
                <div class="mission-burger-preview" id="mission-view"></div>
            </div>
            
            <div class="control-panel">
                <h3 style="margin: 0; font-size: 22px; color: #78350f;">내 알고리즘 결과물 제출</h3>
                <button class="main-btn" style="width: 100%; background: #2563eb; box-shadow: 0 5px 0 #1d4ed8; font-size: 26px; text-shadow: 2px 2px 0px #1d4ed8;" onclick="submitBurger()">🔔 다 만들었어요! (배달)</button>
                <button class="main-btn" style="width: 100%; background: #64748b; box-shadow: 0 5px 0 #475569; font-size: 20px; text-shadow: 2px 2px 0px #475569;" onclick="clearPlate()">🗑️ 접시 비우기</button>
            </div>
        </div>
    </div>

    <!-- 100% 안전하고 선명하게 출력되는 고품질 인라인 SVG 재료 트레이 -->
    <div class="ingredients-tray">
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('bottom')">
                <svg viewBox="0 0 200 50"><path d="M10,10 L190,10 C190,10 190,38 170,43 C150,46 50,46 30,43 C10,38 10,10 10,10 Z" fill="#E29B4F" stroke="#A7611E" stroke-width="5" stroke-linejoin="round"/></svg>
            </div>
            <div class="ingredient-label">1. 아래 빵</div>
        </div>
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('patty')">
                <svg viewBox="0 0 200 40"><rect x="15" y="5" width="170" height="30" rx="15" fill="#753C19" stroke="#461E0A" stroke-width="5"/><line x1="50" y1="10" x2="65" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/><line x1="90" y1="10" x2="105" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/><line x1="130" y1="10" x2="145" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/></svg>
            </div>
            <div class="ingredient-label">2. 패티</div>
        </div>
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('cheese')">
                <svg viewBox="0 0 200 30"><path d="M10,5 L190,5 L180,25 L140,15 L120,28 L80,12 L50,25 L20,10 Z" fill="#FFD54F" stroke="#F5B041" stroke-width="4" stroke-linejoin="round"/></svg>
            </div>
            <div class="ingredient-label">3. 치즈</div>
        </div>
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('lettuce')">
                <svg viewBox="0 0 200 35"><path d="M5,15 Q20,2 40,18 Q60,5 80,20 Q100,5 120,22 Q140,3 160,18 Q180,5 195,20 L190,28 Q170,33 150,25 Q130,35 110,24 Q90,35 70,23 Q50,33 30,22 Q15,30 5,15 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/></svg>
            </div>
            <div class="ingredient-label">4. 양상추</div>
        </div>
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('tomato')">
                <svg viewBox="0 0 200 35"><rect x="12" y="5" width="176" height="25" rx="12" fill="#EF5350" stroke="#C62828" stroke-width="5"/><rect x="30" y="10" width="35" height="15" rx="7" fill="#FF8A80"/><rect x="82" y="10" width="35" height="15" rx="7" fill="#FF8A80"/><rect x="135" y="10" width="35" height="15" rx="7" fill="#FF8A80"/></svg>
            </div>
            <div class="ingredient-label">5. 토마토</div>
        </div>
        <div class="ingredient-item">
            <div class="ingredient-btn" onclick="addIngredient('top')">
                <svg viewBox="0 0 200 70"><path d="M10,60 C10,12 190,12 190,60 C190,65 10,65 10,60 Z" fill="#E29B4F" stroke="#A7611E" stroke-width="5" stroke-linejoin="round"/><ellipse cx="60" cy="35" rx="3" ry="5" fill="#FFFDE7" transform="rotate(15 60 35)"/><ellipse cx="100" cy="25" rx="3" ry="5" fill="#FFFDE7" transform="rotate(-10 100 25)"/><ellipse cx="140" cy="35" rx="3" ry="5" fill="#FFFDE7" transform="rotate(30 140 35)"/><ellipse cx="80" cy="45" rx="3" ry="5" fill="#FFFDE7" transform="rotate(-20 80 45)"/><ellipse cx="120" cy="45" rx="3" ry="5" fill="#FFFDE7" transform="rotate(5 120 45)"/></svg>
            </div>
            <div class="ingredient-label">6. 위 빵</div>
        </div>
    </div>
</div>

<script>
    // 100% 끊김 없이 출력되는 SVG 템플릿 정보 정의
    const svgTemplates = {
        bottom: `<svg viewBox="0 0 200 50" class="w-full h-auto"><path d="M10,10 L190,10 C190,10 190,38 170,43 C150,46 50,46 30,43 C10,38 10,10 10,10 Z" fill="#E29B4F" stroke="#A7611E" stroke-width="5" stroke-linejoin="round"/></svg>`,
        patty: `<svg viewBox="0 0 200 40" class="w-full h-auto"><rect x="15" y="5" width="170" height="30" rx="15" fill="#753C19" stroke="#461E0A" stroke-width="5"/><line x1="50" y1="10" x2="65" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/><line x1="90" y1="10" x2="105" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/><line x1="130" y1="10" x2="145" y2="30" stroke="#461E0A" stroke-width="5" stroke-linecap="round"/></svg>`,
        cheese: `<svg viewBox="0 0 200 30" class="w-full h-auto"><path d="M10,5 L190,5 L180,25 L140,15 L120,28 L80,12 L50,25 L20,10 Z" fill="#FFD54F" stroke="#F5B041" stroke-width="4" stroke-linejoin="round"/></svg>`,
        lettuce: `<svg viewBox="0 0 200 35" class="w-full h-auto"><path d="M5,15 Q20,2 40,18 Q60,5 80,20 Q100,5 120,22 Q140,3 160,18 Q180,5 195,20 L190,28 Q170,33 150,25 Q130,35 110,24 Q90,35 70,23 Q50,33 30,22 Q15,30 5,15 Z" fill="#66BB6A" stroke="#2E7D32" stroke-width="4" stroke-linejoin="round"/></svg>`,
        tomato: `<svg viewBox="0 0 200 35" class="w-full h-auto"><rect x="12" y="5" width="176" height="25" rx="12" fill="#EF5350" stroke="#C62828" stroke-width="5"/><rect x="30" y="10" width="35" height="15" rx="7" fill="#FF8A80"/><rect x="82" y="10" width="35" height="15" rx="7" fill="#FF8A80"/><rect x="135" y="10" width="35" height="15" rx="7" fill="#FF8A80"/></svg>`,
        top: `<svg viewBox="0 0 200 70" class="w-full h-auto"><path d="M10,60 C10,12 190,12 190,60 C190,65 10,65 10,60 Z" fill="#E29B4F" stroke="#A7611E" stroke-width="5" stroke-linejoin="round"/><ellipse cx="60" cy="35" rx="3" ry="5" fill="#FFFDE7" transform="rotate(15 60 35)"/><ellipse cx="100" cy="25" rx="3" ry="5" fill="#FFFDE7" transform="rotate(-10 100 25)"/><ellipse cx="140" cy="35" rx="3" ry="5" fill="#FFFDE7" transform="rotate(30 140 35)"/><ellipse cx="80" cy="45" rx="3" ry="5" fill="#FFFDE7" transform="rotate(-20 80 45)"/><ellipse cx="120" cy="45" rx="3" ry="5" fill="#FFFDE7" transform="rotate(5 120 45)"/></svg>`
    };

    // 10단계의 점진적 학습 알고리즘 미션 데이터 셋
    const missions = [
        { name: "미션 1: 초간단 치즈버거 🧀", recipe: ['bottom', 'patty', 'cheese', 'top'] },
        { name: "미션 2: 새콤달콤 토마토버거 🍅", recipe: ['bottom', 'patty', 'tomato', 'top'] },
        { name: "미션 3: 아삭아삭 야채버거 🥬", recipe: ['bottom', 'patty', 'tomato', 'lettuce', 'top'] },
        { name: "미션 4: 고기매니아 더블패티버거 🍖", recipe: ['bottom', 'patty', 'cheese', 'patty', 'top'] },
        { name: "미션 5: 치즈러버 더블치즈버거 🧀🧀", recipe: ['bottom', 'patty', 'cheese', 'lettuce', 'cheese', 'top'] },
        { name: "미션 6: 푸릇푸릇 웰빙 건강버거 🥗", recipe: ['bottom', 'patty', 'tomato', 'cheese', 'lettuce', 'top'] },
        { name: "미션 7: 순서가 다른 패턴버거 🔄", recipe: ['bottom', 'patty', 'lettuce', 'patty', 'lettuce', 'top'] },
        { name: "미션 8: 마스터 추천 디럭스버거 👑", recipe: ['bottom', 'patty', 'cheese', 'patty', 'cheese', 'tomato', 'top'] },
        { name: "미션 9: 알록달록 무지개버거 🌈", recipe: ['bottom', 'patty', 'tomato', 'lettuce', 'cheese', 'lettuce', 'tomato', 'top'] },
        { name: "미션 10: 알고리즘 끝판왕 타이완버거 🏆", recipe: ['bottom', 'patty', 'cheese', 'tomato', 'lettuce', 'patty', 'cheese', 'top'] }
    ];

    let currentMissionIdx = 0;
    let score = 0;
    let timeLeft = 300; // 5분 제한시간
    let timerId = null;
    let playerStack = [];

    // --- STREAMING_CHUNK: Defining UI rendering logic and controls... ---
    function showCustomAlert(msg) {
        document.getElementById('custom-alert-text').innerText = msg;
        document.getElementById('custom-alert-overlay').style.display = 'flex';
    }

    function closeCustomAlert() {
        document.getElementById('custom-alert-overlay').style.display = 'none';
    }

    function startGame() {
        document.getElementById('start-overlay').style.display = 'none';
        document.getElementById('restart-control').style.display = 'flex';
        resetGameStates();
        startTimer();
        loadMission();
    }

    function resetGame() {
        if(timerId) clearInterval(timerId);
        document.getElementById('result-modal').style.display = 'none';
        resetGameStates();
        startTimer();
        loadMission();
    }

    function resetGameStates() {
        currentMissionIdx = 0;
        score = 0;
        timeLeft = 300;
        playerStack = [];
        updateUI();
        clearPlate();
    }

    function startTimer() {
        if(timerId) clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            updateTimerDisplay();
            if(timeLeft <= 0) endGame();
        }, 1000);
    }

    function updateTimerDisplay() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        document.getElementById('timer').innerText = `⏱️ 시간: ${m}:${s < 10 ? '0'+s : s}`;
    }

    // 미션 데이터 로드 및 겹치기 비율 동적 계산 (8단 레이어 대응)
    function loadMission() {
        const mission = missions[currentMissionIdx];
        document.getElementById('mission-name').innerText = mission.name;
        document.getElementById('mission-count').innerText = `🎯 미션: ${currentMissionIdx + 1} / 10`;
        
        const view = document.getElementById('mission-view');
        view.innerHTML = '';
        
        // 7개 이상 재료를 사용할 경우, 미니어처 높이를 동적으로 최적화하여 겹치게 함
        const layerCount = mission.recipe.length;
        const widthSize = layerCount > 6 ? "75px" : "100px";
        const marginOffset = layerCount > 6 ? "-16px" : "-12px";

        mission.recipe.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.style.width = widthSize;
            wrapper.style.marginBottom = marginOffset;
            wrapper.style.zIndex = "5";
            wrapper.innerHTML = svgTemplates[item];
            view.appendChild(wrapper);
        });
    }

    function addIngredient(type) {
        if(playerStack.length >= 10) return; // 미션 9, 10은 최대 8개이므로 최대 10개까지 방어
        playerStack.push(type);
        
        const plate = document.getElementById('player-plate');
        const wrapper = document.createElement('div');
        wrapper.className = 'burger-layer';
        
        // 플레이어 판넬에 적재할 때도 재료가 많아지면 겹침 마진을 넓혀 넘침을 완벽 방지함
        const layerCount = playerStack.length;
        wrapper.style.width = layerCount > 6 ? "160px" : "180px"; 
        wrapper.style.marginBottom = layerCount > 6 ? "-27px" : "-22px"; 
        
        wrapper.innerHTML = svgTemplates[type];
        plate.appendChild(wrapper);
    }

    function clearPlate() {
        playerStack = [];
        const plate = document.getElementById('player-plate');
        plate.innerHTML = '<div class="plate-label">나의 접시 (아래쪽 빵부터 쌓으세요)</div><div class="plate-base"></div>';
    }

    // 알고리즘 채점 처리 로직
    function submitBurger() {
        if (playerStack.length === 0) {
            showCustomAlert("접시에 아무것도 없어요!\n아래 재료를 선택해 햄버거를 조립해보세요!");
            return;
        }

        const mission = missions[currentMissionIdx];
        const isCorrect = JSON.stringify(playerStack) === JSON.stringify(mission.recipe);

        if(isCorrect) {
            const bonus = timeLeft;
            score += 500 + bonus;
            updateUI();
            
            if(currentMissionIdx < 9) { // 10개 미션이므로 인덱스 0~9 대응
                showCustomAlert(`완벽하게 순서를 성공했어요! ⭐️\n[미션 ${currentMissionIdx + 2}] 단계로 이동합니다!`);
                currentMissionIdx++;
                clearPlate();
                loadMission();
            } else {
                endGame();
            }
        } else {
            showCustomAlert("앗! 알고리즘 순서가 다르거나 재료가 빠졌어요.\n접시를 비우고 가이드 번호 순서에 맞춰 다시 조립해 볼까요?");
        }
    }

    function updateUI() {
        document.getElementById('score').innerText = `⭐ 점수: ${score}`;
    }

    function endGame() {
        clearInterval(timerId);
        document.getElementById('result-modal').style.display = 'flex';
        document.getElementById('final-score').innerText = `${score}점`;
        document.getElementById('final-time-info').innerText = `⏱️ 걸린 시간: ${Math.floor((300-timeLeft)/60)}분 ${(300-timeLeft)%60}초`;
    }
</script>

</body>
</html>
